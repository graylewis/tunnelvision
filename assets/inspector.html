<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tunnelvision inspector</title>
<style>
	:root {
		--bg: #f7f7f8; --panel: #fff; --border: #e3e3e8; --text: #1d1d22; --muted: #6b6b76;
		--hover: #f0f0f4; --sel: #e6eeff; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
		--changed: #d97706; --added: #16a34a; --removed: #dc2626; --size: #a21caf; --error: #dc2626;
		--unchanged: #b4b4bd; --missing: #d4d4da; --accent: #2563eb;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #141417; --panel: #1c1c20; --border: #2e2e35; --text: #e8e8ec; --muted: #8d8d99;
			--hover: #25252b; --sel: #1f2d4d; --unchanged: #55555f; --missing: #3a3a42; --accent: #6b9bff;
		}
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; }
	body { font: 13px/1.4 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
	header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
	header h1 { font-size: 14px; margin: 0 8px 0 0; }
	header label { color: var(--muted); display: flex; align-items: center; gap: 6px; }
	#threshold { width: 64px; }
	select, input[type=search], input[type=number], button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 3px 6px; }
	button { cursor: pointer; }
	.summary { margin-left: auto; display: flex; gap: 10px; color: var(--muted); }
	.summary b { color: var(--text); }
	main { flex: 1; display: flex; min-height: 0; }
	#tree { width: 460px; min-width: 280px; resize: horizontal; overflow: auto; border-right: 1px solid var(--border); background: var(--panel); padding: 6px 0; }
	#detail { flex: 1; overflow: auto; padding: 16px 20px; }
	.row { display: flex; align-items: center; gap: 6px; padding: 2px 8px 2px 0; cursor: pointer; white-space: nowrap; }
	.row:hover { background: var(--hover); }
	.row.selected { background: var(--sel); }
	.caret { width: 14px; text-align: center; color: var(--muted); flex: none; font-size: 13px; }
	.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
	.label { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
	.label .id { color: var(--accent); }
	.label .cls { color: var(--muted); }
	.page-row .label { font-family: inherit; font-weight: 600; font-size: 13px; }
	.meta { margin-left: auto; display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 11px; flex: none; padding-left: 8px; }
	.badge { border-radius: 8px; padding: 0 6px; font-size: 11px; color: #fff; background: var(--changed); }
	.moved { border: 1px solid var(--border); border-radius: 8px; padding: 0 6px; font-size: 10px; }
	.src { font-family: var(--mono); font-size: 11px; color: var(--muted); max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
	.s-changed { background: var(--changed); } .s-added { background: var(--added); } .s-removed { background: var(--removed); }
	.s-size-mismatch { background: var(--size); } .s-error { background: var(--error); }
	.s-unchanged { background: var(--unchanged); } .s-missing { background: transparent; border: 1px solid var(--unchanged); }
	.empty { color: var(--muted); padding: 40px; text-align: center; }
	h2 { font-size: 16px; margin: 0 0 4px; font-family: var(--mono); word-break: break-all; }
	.status-pill { display: inline-block; color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 11px; font-family: system-ui, sans-serif; vertical-align: middle; margin-left: 6px; }
	.status-pill.s-missing, .status-pill.s-unchanged { color: var(--text); }
	dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 12px 0 18px; }
	dt { color: var(--muted); }
	dd { margin: 0; font-family: var(--mono); font-size: 12px; word-break: break-all; }
	dd a { color: var(--accent); text-decoration: none; }
	dd a:hover { text-decoration: underline; }
	.open-in { display: inline-flex; gap: 4px; margin-left: 8px; vertical-align: 1px; }
	.open-btn { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 6px; border-radius: 4px; background: var(--brand); color: #fff; font: 600 11px/16px system-ui, sans-serif; white-space: nowrap; transition: background .12s; }
	.open-btn svg { width: 12px; height: 12px; fill: currentColor; flex: none; }
	.open-btn:hover { text-decoration: none; background: var(--brand-hover); }
	.open-btn.zed { --brand: #084ccf; --brand-hover: #063ea8; }
	.open-btn.vscode { --brand: #007acc; --brand-hover: #0062a3; }
	dd a.open-btn, dd a.open-btn:hover { color: #fff; text-decoration: none; }
	.chain { list-style: none; margin: 0; padding: 0; }
	.chain li { padding: 1px 0; }
	.chain .name { color: var(--text); }
	.chain .loc { color: var(--muted); margin-left: 8px; }
	.images { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-bottom: 22px; }
	figure { margin: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 8px; }
	figcaption { color: var(--muted); font-size: 11px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
	figure img { max-width: 100%; display: block; background: repeating-conic-gradient(#8881 0 25%, transparent 0 50%) 0 0 / 16px 16px; }
	.noimg { color: var(--muted); font-style: italic; padding: 30px 0; text-align: center; }
	.context { position: relative; display: inline-block; max-width: 100%; }
	.context img { max-width: 100%; display: block; }
	.overlay { position: absolute; border: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 15%, transparent); pointer-events: none; }
	.overlay.from { border-style: dashed; border-color: var(--removed); background: transparent; }
	.hint { color: var(--muted); font-size: 11px; }
	kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; }
	.group { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 10px 10px 4px; }
	.cause-text { color: var(--muted); font-family: var(--mono); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
	.via { border: 1px solid var(--border); border-radius: 8px; padding: 0 6px; font-size: 10px; color: var(--muted); }
	table.props { border-collapse: collapse; font-family: var(--mono); font-size: 12px; margin: 0 0 18px; }
	table.props td { padding: 2px 14px 2px 0; vertical-align: top; }
	table.props td:first-child { color: var(--muted); }
	ul.effects { list-style: none; margin: 0; padding: 0; }
	ul.effects li { padding: 1px 0; }
	a.el { color: var(--accent); text-decoration: none; cursor: pointer; }
	a.el:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
	<h1>tunnelvision inspector</h1>
	<label>from <select id="from"></select></label>
	<label>to <select id="to"></select></label>
	<label title="Elements: the page trees. Causes: the changed lines that explain visual changes.">view <select id="view"><option value="elements">elements</option><option value="causes">causes</option></select></label>
	<label title="pixelmatch colour threshold (0–1); lower catches subtler colour changes">threshold <input type="number" id="threshold" min="0" max="1" step="0.01" /></label>
	<label><input type="checkbox" id="changedOnly" checked /> changed only</label>
	<input type="search" id="filter" placeholder="filter tag, id, class, source…" />
	<button id="refresh" title="Re-run the diff">↻ Re-diff</button>
	<div class="summary" id="summary"></div>
</header>
<main>
	<div id="tree"><div class="empty">Loading…</div></div>
	<div id="detail"><div class="empty">Select a page or element.<br /><span class="hint"><kbd>↑</kbd> <kbd>↓</kbd> move · <kbd>←</kbd> <kbd>→</kbd> collapse / expand</span></div></div>
</main>
<script>
const CHANGE = new Set(["changed", "added", "removed", "size-mismatch", "error"]);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const enc = (p) => p.split("/").map(encodeURIComponent).join("/");

let state = { root: "", data: null, expanded: new Set(), selected: null, rows: [], view: "elements" };

async function getJson(url) {
	const res = await fetch(url);
	const body = await res.json();
	if (!res.ok) throw new Error(body.error || res.statusText);
	return body;
}

async function init() {
	const { root, versions, threshold } = await getJson("/api/versions");
	state.root = root;
	state.defaultThreshold = threshold;
	if (versions.length < 2) {
		$("tree").innerHTML = '<div class="empty">Need at least two captured versions to diff.</div>';
		return;
	}
	const opt = (v) => `<option value="${esc(v.key)}">${esc(v.key)}${v.byElement ? "" : " · pages only"} — ${esc(new Date(v.capturedAt).toLocaleString())}</option>`;
	const html = versions.map(opt).reverse().join("");
	$("from").innerHTML = html;
	$("to").innerHTML = html;

	// Default: newest two versions, preferring by-element captures.
	const params = new URLSearchParams(location.search);
	const pool = versions.filter((v) => v.byElement).length >= 2 ? versions.filter((v) => v.byElement) : versions;
	$("to").value = params.get("to") || pool[pool.length - 1].key;
	$("from").value = params.get("from") || pool[pool.length - 2].key;
	$("threshold").value = params.get("threshold") ?? threshold;

	$("from").onchange = $("to").onchange = () => load();
	$("refresh").onclick = () => load(true);
	$("threshold").onchange = () => {
		const t = Number($("threshold").value);
		if ($("threshold").value === "" || !(t >= 0 && t <= 1)) $("threshold").value = state.data?.threshold ?? state.defaultThreshold;
		load();
	};
	$("changedOnly").onchange = () => renderTree();
	$("view").value = state.view = params.get("view") === "causes" ? "causes" : "elements";
	$("view").onchange = () => {
		state.view = $("view").value;
		state.selected = null;
		updateUrl();
		renderTree();
		renderDetail();
	};
	$("filter").oninput = () => renderTree();
	load();
}

function updateUrl() {
	const from = $("from").value, to = $("to").value, threshold = Number($("threshold").value);
	const custom = threshold !== state.defaultThreshold ? `&threshold=${threshold}` : "";
	const view = state.view === "causes" ? "&view=causes" : "";
	history.replaceState(null, "", `?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}${custom}${view}`);
}

async function load(refresh) {
	const from = $("from").value, to = $("to").value, threshold = Number($("threshold").value);
	updateUrl();
	$("tree").innerHTML = '<div class="empty">Diffing…</div>';
	$("summary").innerHTML = "";
	try {
		state.data = await getJson(`/api/diff?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&threshold=${threshold}${refresh ? "&refresh=1" : ""}`);
	} catch (err) {
		$("tree").innerHTML = `<div class="empty">${esc(err.message)}</div>`;
		return;
	}
	indexData();
	const s = state.data.summary;
	$("summary").innerHTML = `<span><b>${state.data.pages.length}</b> pages</span><span><b>${s.changedCount}</b> changed</span><span><b>${s.addedCount}</b> added</span><span><b>${s.removedCount}</b> removed</span>`;
	// Expand everything that contains a change so the interesting paths are visible.
	state.expanded = new Set();
	for (const item of state.items.values()) {
		if (item.page ? item.page.changedElements > 0 : item.node?.changedDescendants > 0) state.expanded.add(item.key);
	}
	if (!state.items.has(state.selected)) state.selected = null;
	renderTree();
	renderDetail();
}

/** Flatten pages + nodes into a key -> item map for selection and lookup. */
function indexData() {
	state.items = new Map();
	for (const page of state.data.pages) {
		const pkey = "p:" + page.slug;
		state.items.set(pkey, { key: pkey, page, depth: 0, parent: null });
		const visit = (nodes, depth, parent) => {
			for (const node of nodes) {
				const key = pkey + "/" + node.uid;
				state.items.set(key, { key, node, pageRef: page, depth, parent });
				visit(node.children, depth + 1, key);
			}
		};
		visit(page.elements, 1, pkey);
	}

	// Causes, and what they explain per element (keyed by page/dir).
	const c = state.data.correlation;
	state.causesOf = new Map();
	state.unexplainedOf = new Map();
	if (!c) return;
	c.causes.forEach((cause, i) => {
		state.items.set("c:" + i, { key: "c:" + i, cause });
		for (const effect of cause.effects) {
			const k = effect.page + "/" + effect.dir;
			state.causesOf.set(k, [...(state.causesOf.get(k) ?? []), { cause, effect, key: "c:" + i }]);
		}
	});
	c.unexplained.forEach((u, i) => {
		state.items.set("u:" + i, { key: "u:" + i, unexplained: u });
		state.unexplainedOf.set(u.page + "/" + u.dir, u);
	});
	c.invisible.forEach((inv, i) => state.items.set("i:" + i, { key: "i:" + i, invisible: inv }));
}

/** The tree key of an effect's element (removed elements are keyed by their baseline path). */
function elementKey(e) {
	return "p:" + e.page + "/" + (e.status === "removed" ? "removed:" + e.dir : e.dir);
}

/** A cause's location, as a source link relative to the repository. */
function causeSource(cause) {
	return { fileName: state.data.repoRoot.replace(/\/$/, "") + "/" + cause.path, lineNumber: cause.line, columnNumber: 1, path: `${cause.path}:${cause.line}` };
}

const VIA = { direct: "sets it", inherited: "inherited", var: "via var()", jsx: "JSX line", copy: "copy", "knock-on": "knock-on" };

/**
 * Normalise a source location from an element's `component`. Accepts `{ path }`,
 * `{ fileName, lineNumber, columnNumber }` or `{ file|url, line, column }`.
 */
function loc(src) {
	if (!src) return null;
	const file = src.fileName ?? src.file ?? src.url ?? "";
	const line = src.lineNumber ?? src.line, col = src.columnNumber ?? src.column;
	const path = src.path ?? (file ? [file, line, col].filter((x) => x != null).join(":") : "");
	return path ? { file, line, col, path, generated: Boolean(src.generated) } : null;
}
function srcPath(src) { return loc(src)?.path ?? ""; }

function matchesFilter(node, q) {
	if (!q) return true;
	const c = node.component;
	const hay = [node.tag, node.id, node.className, node.selector, c && srcPath(c.source), ...(c ? c.components.map((x) => x.name + " " + srcPath(x.source)) : [])].join(" ").toLowerCase();
	return hay.includes(q);
}

/** Whether a node (or any descendant) should be shown under the current filters. */
function visible(node, changedOnly, q) {
	const self = (!changedOnly || CHANGE.has(node.status)) && matchesFilter(node, q);
	return self || node.children.some((c) => visible(c, changedOnly, q));
}

function label(node) {
	let s = `<span class="tag">${esc(node.tag)}</span>`;
	if (node.id) s += `<span class="id">#${esc(node.id)}</span>`;
	if (node.className) s += `<span class="cls">.${esc(node.className.split(/\s+/).slice(0, 2).join("."))}${node.className.split(/\s+/).length > 2 ? "…" : ""}</span>`;
	return s;
}

function renderCauses() {
	const c = state.data.correlation;
	state.rows = [];
	if (!c) {
		$("tree").innerHTML = `<div class="empty">Causes not traced${state.data.correlationSkipped ? ": " + esc(state.data.correlationSkipped) : ""}.</div>`;
		return;
	}
	const q = $("filter").value.trim().toLowerCase();
	const out = [];
	const row = (key, dot, labelHtml, metaHtml) => {
		state.rows.push(key);
		out.push(`<div class="row ${state.selected === key ? "selected" : ""}" data-key="${esc(key)}" style="padding-left:10px">` +
			`<span class="dot s-${dot}"></span><span class="label">${labelHtml}</span><span class="meta">${metaHtml}</span></div>`);
	};
	const group = (title, n) => out.push(`<div class="group">${esc(title)} · ${n}</div>`);
	const match = (...parts) => !q || parts.join(" ").toLowerCase().includes(q);

	const causes = c.causes.map((cause, i) => [cause, i]).filter(([x]) => match(x.path, x.text ?? ""));
	group("Causes", causes.length);
	for (const [cause, i] of causes) {
		const where = `${cause.path.split("/").pop()}:${cause.line}${cause.side === "LEFT" ? " (deleted)" : ""}`;
		row("c:" + i, "changed", `${esc(where)} <span class="cause-text">${esc(cause.text ?? cause.kind)}</span>`, `<span class="badge" title="elements affected">${cause.effects.length}</span>`);
	}
	const unexplained = c.unexplained.map((u, i) => [u, i]).filter(([u]) => match(u.page, u.dir));
	if (unexplained.length) group("Unexplained visual changes", unexplained.length);
	for (const [u, i] of unexplained) row("u:" + i, u.status, esc(u.page + "/" + u.dir), u.note ? `<span class="src" title="${esc(u.note)}">${esc(u.note)}</span>` : "");
	const invisible = c.invisible.map((v, i) => [v, i]).filter(([v]) => match(v.path));
	if (invisible.length) group("CSS changes with no visible effect", invisible.length);
	for (const [v, i] of invisible) {
		row("i:" + i, "unchanged", esc(`${v.path.split("/").pop()}:${v.line}${v.side === "LEFT" ? " (deleted)" : ""}`), `<span class="via">${v.reason === "not-exercised" ? "not exercised" : "no effect"}</span>`);
	}
	$("tree").innerHTML = out.join("");
	const sel = $("tree").querySelector(".selected");
	if (sel) sel.scrollIntoView({ block: "nearest" });
}

function renderTree() {
	if (!state.data) return;
	if (state.view === "causes") return renderCauses();
	const changedOnly = $("changedOnly").checked;
	const q = $("filter").value.trim().toLowerCase();
	const filtering = changedOnly || q;
	const out = [];
	state.rows = [];

	const row = (key, depth, hasKids, dotStatus, labelHtml, metaHtml, cls = "") => {
		state.rows.push(key);
		const open = state.expanded.has(key);
		out.push(`<div class="row ${cls} ${state.selected === key ? "selected" : ""}" data-key="${esc(key)}" style="padding-left:${6 + depth * 14}px">` +
			`<span class="caret" data-toggle="1">${hasKids ? (open ? "▾" : "▸") : ""}</span>` +
			`<span class="dot s-${dotStatus}" title="${esc(dotStatus)}"></span>` +
			`<span class="label">${labelHtml}</span><span class="meta">${metaHtml}</span></div>`);
		return open;
	};

	const walk = (nodes, pkey, depth) => {
		for (const node of nodes) {
			if (filtering && !visible(node, changedOnly, q)) continue;
			const key = pkey + "/" + node.uid;
			const kids = filtering ? node.children.filter((c) => visible(c, changedOnly, q)) : node.children;
			let meta = "";
			const src = node.component && srcPath(node.component.source);
			if (src) meta += `<span class="src" title="${esc(src)}">${esc(src.split("/").pop())}</span>`;
			if (node.moved) meta += `<span class="moved" title="moved from ${esc(node.fromDir)}">moved</span>`;
			if (node.diffPercent !== undefined && CHANGE.has(node.status)) meta += `<span>${node.diffPercent.toFixed(2)}%</span>`;
			if (node.changedDescendants) meta += `<span class="badge" title="changed descendants">${node.changedDescendants}</span>`;
			if (row(key, depth, kids.length > 0, node.status, label(node), meta)) walk(kids, pkey, depth + 1);
		}
	};

	for (const page of state.data.pages) {
		const pageChanged = CHANGE.has(page.status) || page.changedElements > 0;
		const pageMatches = !q || page.slug.toLowerCase().includes(q);
		const kids = filtering ? page.elements.filter((c) => visible(c, changedOnly, q)) : page.elements;
		if (changedOnly && !pageChanged) continue;
		if (q && !pageMatches && kids.length === 0) continue;
		const key = "p:" + page.slug;
		let meta = page.byElement ? "" : "<span>full page</span>";
		if (page.changedElements) meta += `<span class="badge" title="changed elements">${page.changedElements}</span>`;
		if (row(key, 0, kids.length > 0, page.status, esc(page.slug), meta, "page-row")) walk(kids, key, 1);
	}

	$("tree").innerHTML = out.length ? out.join("") : `<div class="empty">${changedOnly ? "No changes between these versions." : "Nothing matches."}</div>`;
	const sel = $("tree").querySelector(".selected");
	if (sel) sel.scrollIntoView({ block: "nearest" });
}

$("tree").addEventListener("click", (e) => {
	const rowEl = e.target.closest(".row");
	if (!rowEl) return;
	const key = rowEl.dataset.key;
	if (e.target.dataset.toggle || state.selected === key) toggle(key);
	select(key);
});

function toggle(key, force) {
	const open = force ?? !state.expanded.has(key);
	if (open) state.expanded.add(key); else state.expanded.delete(key);
	renderTree();
}

function select(key) {
	state.selected = key;
	renderTree();
	renderDetail();
}

document.addEventListener("keydown", (e) => {
	if (e.target.matches("input, select") || !state.rows.length) return;
	const i = state.rows.indexOf(state.selected);
	if (e.key === "ArrowDown" || e.key === "j") select(state.rows[Math.min(state.rows.length - 1, i + 1)]);
	else if (e.key === "ArrowUp" || e.key === "k") select(state.rows[Math.max(0, i - 1)]);
	else if (state.view === "causes") return;
	else if (e.key === "ArrowRight" && state.selected) toggle(state.selected, true);
	else if (e.key === "ArrowLeft" && state.selected) {
		const item = state.items.get(state.selected);
		if (state.expanded.has(state.selected)) toggle(state.selected, false);
		else if (item.parent) select(item.parent);
	} else return;
	e.preventDefault();
});

function imgUrl(kind, rel) {
	const d = state.data;
	// Diff images are rewritten per threshold, so key them by it to dodge the browser's image cache.
	return kind === "diff" ? `/img/diff/${encodeURIComponent(d.from + "__" + d.to)}/${enc(rel)}?t=${d.threshold}` :`/img/version/${encodeURIComponent(kind === "from" ? d.from : d.to)}/${enc(rel)}`;
}

function figure(title, kind, rel, present, why) {
	return `<figure><figcaption>${esc(title)}</figcaption>${present ? `<img src="${imgUrl(kind, rel)}" loading="lazy" />` : `<div class="noimg">${esc(why)}</div>`}</figure>`;
}

/** `rel` is the target's image path; `fromRel` the baseline's when it differs. */
function imageGrid(rel, item, fromRel = rel) {
	const d = state.data;
	const diffWhy = item.status === "unchanged" ? "no visible change" : item.status === "size-mismatch" ? "sizes differ — compare side by side" : "no diff image";
	return `<div class="images">` +
		figure(`before · ${d.from}`, "from", fromRel, item.images.from, "not captured") +
		figure(`after · ${d.to}`, "to", rel, item.images.to, "not captured") +
		figure("diff", "diff", rel, item.images.diff, diffWhy) + `</div>`;
}

/** A link that opens `file:line:col` in VS Code, plus the path itself. */
/** Official editor marks (24×24, via Simple Icons). */
const ZED_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.25 1.5a.75.75 0 0 0-.75.75v16.5H0V2.25A2.25 2.25 0 0 1 2.25 0h20.095c1.002 0 1.504 1.212.795 1.92L10.764 14.298h3.486V12.75h1.5v1.922a1.125 1.125 0 0 1-1.125 1.125H9.264l-2.578 2.578h11.689V9h1.5v9.375a1.5 1.5 0 0 1-1.5 1.5H5.185L2.562 22.5H21.75a.75.75 0 0 0 .75-.75V5.25H24v16.5A2.25 2.25 0 0 1 21.75 24H1.655C.653 24 .151 22.788.86 22.08L13.19 9.75H9.75v1.5h-1.5V9.375A1.125 1.125 0 0 1 9.375 8.25h5.314l2.625-2.625H5.625V15h-1.5V5.625a1.5 1.5 0 0 1 1.5-1.5h13.19L21.438 1.5z"/></svg>';
const VSCODE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.15 2.587L18.21.21a1.494 1.494 0 0 0-1.705.29l-9.46 8.63-4.12-3.128a.999.999 0 0 0-1.276.057L.327 7.261A1 1 0 0 0 .326 8.74L3.899 12 .326 15.26a1 1 0 0 0 .001 1.479L1.65 17.94a.999.999 0 0 0 1.276.057l4.12-3.128 9.46 8.63a1.492 1.492 0 0 0 1.704.29l4.942-2.377A1.5 1.5 0 0 0 24 20.06V3.939a1.5 1.5 0 0 0-.85-1.352zm-5.146 14.861L10.826 12l7.178-5.448v10.896z"/></svg>';

/** The location as text, plus buttons that open `file:line:col` in Zed or VS Code. */
function sourceLink(src) {
	const l = loc(src);
	if (!l) return '<span class="hint">no source location</span>';
	const note = l.generated ? ' <span class="hint" title="no source map; location is in the served script">(generated)</span>' : "";
	if (!l.file || /^[a-z]+:\/\//i.test(l.file)) return esc(l.path) + note;
	const abs = l.file.startsWith("/") ? l.file : state.root.replace(/\/$/, "") + "/" + l.file;
	const target = `${enc(abs)}:${l.line ?? 1}:${l.col ?? 1}`;
	return `<span class="path">${esc(l.path)}</span>${note}` +
		`<span class="open-in"><a class="open-btn zed" href="zed://file${target}" title="Open in Zed">${ZED_ICON}Zed</a>` +
		`<a class="open-btn vscode" href="vscode://file${target}" title="Open in VS Code">${VSCODE_ICON}VS Code</a></span>`;
}

/** How the baseline partner was found, most deliberate first (see matching.ts). */
const MATCHED_BY = {
	id: "id",
	key: "React key",
	component: "component + source file",
	name: "name attribute",
	source: "source line",
	order: "order among similar siblings",
	"tag-order": "order among siblings with the same tag",
};

function rectText(r) { return r ? `${r.width}×${r.height} @ ${r.x},${r.y}` : "—"; }

function renderDetail() {
	const item = state.selected && state.items.get(state.selected);
	if (!item) {
		$("detail").innerHTML = '<div class="empty">Select a page or element.</div>';
		return;
	}
	const pill = (s) => `<span class="status-pill s-${s}">${esc(s)}</span>`;

	if (item.cause) return renderCause(item.cause);
	if (item.unexplained) {
		const u = item.unexplained;
		$("detail").innerHTML = `<h2>${esc(u.page + "/" + u.dir)}${pill(u.status)}</h2>` +
			`<p class="hint">No changed line explains this visual change.${u.note ? " " + esc(u.note) + "." : ""}</p>` +
			propsTable(u.props) + `<p><a class="el" data-goto="${esc(elementKey(u))}">Show element →</a></p>`;
		return;
	}
	if (item.invisible) {
		const v = item.invisible;
		$("detail").innerHTML = `<h2>${esc(v.path + ":" + v.line)}</h2><dl><dt>source</dt><dd>${sourceLink(causeSource(v))}</dd>` +
			`<dt>side</dt><dd>${v.side === "LEFT" ? "deleted line" : "added line"}</dd></dl>` +
			`<p class="hint">${v.reason === "not-exercised"
				? "No captured element matched this rule: it may only apply in a state or viewport that isn't captured (hover, another breakpoint, a page not in the sitemap)."
				: "The rule applies to captured elements, but this change made no visible difference to any of them."}</p>`;
		return;
	}

	if (item.page) {
		const p = item.page;
		$("detail").innerHTML = `<h2>${esc(p.slug)}${pill(p.status)}</h2>` +
			`<dl>${p.url ? `<dt>url</dt><dd><a href="${esc(p.url)}" target="_blank" rel="noreferrer">${esc(p.url)}</a></dd>` : ""}` +
			(p.diffPercent !== undefined ? `<dt>mismatch</dt><dd>${p.diffPercent.toFixed(3)}%</dd>` : "") +
			(p.message ? `<dt>note</dt><dd>${esc(p.message)}</dd>` : "") +
			(p.byElement ? `<dt>elements</dt><dd>${p.changedElements} changed</dd>` : "") + `</dl>` +
			imageGrid(p.image, p);
		return;
	}

	const n = item.node, page = item.pageRef, c = n.component;
	let dl = `<dt>selector</dt><dd>${esc(n.selector)}</dd>`;
	if (n.className) dl += `<dt>class</dt><dd>${esc(n.className)}</dd>`;
	dl += `<dt>path</dt><dd>${esc(page.slug + "/" + n.dir)}</dd>`;
	if (n.fromDir && n.fromDir !== n.dir) dl += `<dt>was at</dt><dd>${esc(page.slug + "/" + n.fromDir)}${n.moved ? ' <span class="hint">(moved to a different parent)</span>' : ""}</dd>`;
	if (n.matchedBy) dl += `<dt>matched by</dt><dd>${esc(MATCHED_BY[n.matchedBy] ?? n.matchedBy.replace(/^attr:/, ""))}</dd>`;
	if (n.diffPercent !== undefined) dl += `<dt>mismatch</dt><dd>${n.diffPercent.toFixed(3)}%</dd>`;
	if (n.message) dl += `<dt>note</dt><dd>${esc(n.message)}</dd>`;
	dl += `<dt>rect</dt><dd>before ${rectText(n.rect.from)}<br />after&nbsp; ${rectText(n.rect.to)}</dd>`;
	if (c) {
		dl += `<dt>source</dt><dd>${sourceLink(c.source)}</dd>`;
		if (c.components.length) {
			dl += `<dt>rendered by</dt><dd><ol class="chain">` +
				c.components.map((x) => `<li><span class="name">&lt;${esc(x.name)}&gt;</span><span class="loc">${x.source ? sourceLink(x.source) : ""}</span></li>`).join("") +
				`</ol></dd>`;
		}
	} else {
		dl += `<dt>source</dt><dd><span class="hint">not rendered by React</span></dd>`;
	}

	const causedBy = state.causesOf.get(page.slug + "/" + n.dir) ?? [];
	const unexplained = state.unexplainedOf.get(page.slug + "/" + n.dir);
	if (causedBy.length) {
		dl += `<dt>caused by</dt><dd><ul class="effects">` + causedBy.map(({ cause, effect, key }) =>
			`<li><a class="el" data-goto="${esc(key)}">${esc(cause.path + ":" + cause.line)}</a> <span class="via">${esc(VIA[effect.via])}</span> <span class="hint">${esc(cause.text ?? "")}</span></li>`).join("") + `</ul></dd>`;
	} else if (unexplained) {
		dl += `<dt>caused by</dt><dd><span class="hint">no changed line explains it${unexplained.note ? " — " + esc(unexplained.note) : ""}</span></dd>`;
	}
	const props = causedBy[0]?.effect.props ?? unexplained?.props ?? [];

	let html = `<h2>${label(n)}${pill(n.status)}</h2><dl>${dl}</dl>` + propsTable(props) + imageGrid(`${page.slug}/${n.dir}/element.png`, n, `${page.slug}/${n.fromDir ?? n.dir}/element.png`);

	// Where the element sits on the full page (after, falling back to before).
	const side = page.images.to ? "to" : page.images.from ? "from" : null;
	if (side) {
		html += `<figure><figcaption>on page · ${esc(side === "to" ? state.data.to : state.data.from)} <span class="hint">(solid: after, dashed: before)</span></figcaption>` +
			`<div class="context"><img id="ctx" src="${imgUrl(side, page.image)}" /></div></figure>`;
	}
	$("detail").innerHTML = html;

	const ctx = $("ctx");
	if (ctx) {
		// Outline where each version's element is cropped from (image px).
		const key = state.selected;
		const loaded = new Promise((r) => (ctx.complete ? r() : (ctx.onload = r)));
		loaded.then(() => {
			if (state.selected !== key || !ctx.isConnected) return;
			const k = ctx.clientWidth / ctx.naturalWidth;
			for (const which of ["from", "to"]) {
				const b = n.crop[which];
				if (!b) continue;
				const o = document.createElement("div");
				o.className = "overlay " + which;
				Object.assign(o.style, { left: b.x * k + "px", top: b.y * k + "px", width: b.width * k + "px", height: b.height * k + "px" });
				ctx.parentElement.appendChild(o);
			}
		});
	}
}

/** Tracked properties that changed on an element, before → after. */
function propsTable(props) {
	if (!props.length) return "";
	// Properties whose declaration didn't change are results of layout or an ancestor.
	const sorted = [...props].sort((a, b) => Number(Boolean(b.own)) - Number(Boolean(a.own)));
	return `<table class="props">` + sorted.map((p) =>
		`<tr${p.own ? "" : ' class="hint" title="result of layout or an ancestor; its declaration didn\'t change"'}><td>${esc(p.name)}</td><td>${esc(p.from ?? "—")} → ${esc(p.to ?? "—")}</td></tr>`).join("") + `</table>`;
}

function renderCause(cause) {
	const rep = cause.representative;
	let html = `<h2>${esc(cause.path + ":" + cause.line)}</h2><dl>` +
		`<dt>source</dt><dd>${sourceLink(causeSource(cause))}</dd>` +
		(cause.text ? `<dt>${cause.side === "LEFT" ? "was" : "now"}</dt><dd>${esc(cause.text)}</dd>` : "") +
		`<dt>kind</dt><dd>${esc(cause.kind)}${cause.side === "LEFT" ? " (deleted line)" : ""}</dd>` +
		`<dt>affects</dt><dd>${cause.effects.length} element${cause.effects.length === 1 ? "" : "s"}</dd></dl>`;
	if (rep) {
		const node = state.items.get(elementKey(rep))?.node;
		html += `<figcaption>representative · <a class="el" data-goto="${esc(elementKey(rep))}">${esc(rep.page + "/" + rep.dir)}</a></figcaption>`;
		if (node) html += imageGrid(`${rep.page}/${node.dir}/element.png`, node, `${rep.page}/${node.fromDir ?? node.dir}/element.png`);
		html += propsTable(rep.props);
	}
	const order = { direct: 0, inherited: 1, var: 1, jsx: 1, copy: 1, "knock-on": 2 };
	const effects = [...cause.effects].sort((a, b) => order[a.via] - order[b.via] || b.size - a.size);
	html += `<figcaption>affected elements</figcaption><ul class="effects">` + effects.map((e) =>
		`<li><a class="el" data-goto="${esc(elementKey(e))}">${esc(e.page + "/" + e.dir)}</a> <span class="via">${esc(VIA[e.via])}</span>` +
		(e.props.some((p) => p.own) ? ` <span class="hint">${esc(e.props.filter((p) => p.own).map((p) => p.name).slice(0, 4).join(", "))}</span>` : "") +
		(e.alsoCausedBy ? ` <span class="hint">also ${esc(e.alsoCausedBy.join(", "))}</span>` : "") + `</li>`).join("") + `</ul>`;
	$("detail").innerHTML = html;
}

/** Jump from a cause to an element (or back), switching views as needed. */
$("detail").addEventListener("click", (e) => {
	const link = e.target.closest("a.el[data-goto]");
	if (!link) return;
	const key = link.dataset.goto;
	if (!state.items.has(key)) return;
	state.view = $("view").value = key.startsWith("p:") ? "elements" : "causes";
	updateUrl();
	if (key.startsWith("p:")) {
		// Reveal the element in the tree.
		for (let k = state.items.get(key).parent; k; k = state.items.get(k)?.parent) state.expanded.add(k);
	}
	select(key);
});

init().catch((err) => { $("tree").innerHTML = `<div class="empty">${esc(err.message)}</div>`; });
</script>
</body>
</html>
